<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie-Tracker</title>
</head>
<body>
    <div>
        <a href="/">home</a>
        <h1>Artists</h1>
        {{range .}}
            <div>
                <img src="{{.Image}}" alt="{{.Name}}" width="200">
                <p>{{.Name}}</p>
                <p><strong>Members:</strong></p>
                <ul>
                    {{range .Members}}
                        <li>{{.}}</li>
                    {{end}}
                </ul>
            </div>
        {{else}}
            <p>No artists found.</p>
        {{end}}
    </div>
</body>
</html>
